<div id="login">
  <div class="login-card">
    <div class="login-logo" id="login-logo-day">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" fill="none" width="192" height="32" aria-label="Cintelis AI"><g fill="none" transform="translate(2 4) scale(0.2667)"><path d="M93.71 31.72 A44 44 0 1 0 93.71 88.28" stroke="#0F1114" stroke-width="14"/><path d="M93.71 31.72 A44 44 0 0 0 66.12 16.43" stroke="#5B7CFA" stroke-width="14"/></g><text x="48" y="27" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="19" fill="#0F0F0F" letter-spacing="-0.2">Cintelis AI</text></svg>
    </div>
    <div class="login-logo" id="login-logo-night" style="display:none">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" fill="none" width="192" height="32" aria-label="Cintelis AI"><g fill="none" transform="translate(2 4) scale(0.2667)"><path d="M93.71 31.72 A44 44 0 1 0 93.71 88.28" stroke="#E7E8EA" stroke-width="14"/><path d="M93.71 31.72 A44 44 0 0 0 66.12 16.43" stroke="#5B7CFA" stroke-width="14"/></g><text x="48" y="27" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="19" fill="#FFFFFF" letter-spacing="-0.2">Cintelis AI</text></svg>
    </div>
    <div class="login-sub">Customer Onboarding</div>
    <label>Email</label>
    <input id="l-user" type="text" placeholder="you@example.com" autocomplete="username">
    <label>Password</label>
    <input id="l-pass" type="password" placeholder="********" autocomplete="current-password">
    <div class="login-err" id="l-err">Invalid credentials. Try again.</div>
    <button class="login-btn" type="button" onclick="doLogin()">
      <span>Sign In</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="ico-arr-head" d="m12 5 7 7-7 7"/>
        <path class="ico-arr-head" d="M14 12h5"/>
        <path d="M5 12h9"/>
      </svg>
    </button>
  </div>
</div>

<div id="app">

    <div class="topbar-left">

      <input id="global-search-input" type="search" placeholder="Search issues, pages, contacts…  ( / )" autocomplete="off" oninput="onGlobalSearchInput(this.value)" onfocus="onGlobalSearchFocus()">
      <div class="global-search-dropdown" id="global-search-dropdown"></div>
    </div>
    <button class="topbar-create-btn" id="topbar-create" type="button" onclick="topbarCreate()" style="display:none">+ Create</button>
    <div class="topbar-actions">

        <span class="topbar-bell-badge" id="inbox-badge" style="display:none">0</span>
      </button>
      <button class="icon-btn icon-btn-ghost" id="theme-toggle" type="button" onclick="toggleTheme()" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
      <button class="topbar-avatar-btn" type="button" onclick="nav('account')" title="My Account" id="topbar-avatar"></button>
