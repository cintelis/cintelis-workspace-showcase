name = "cintelis-workspace"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Hostnames this Worker answers on (Workers custom domains; DNS + cert are
# managed by Cloudflare). The app lives on projects.*, the public token API
# on api.* — see worker/config.js and the host check at the top of fetch().
routes = [
  { pattern = "projects.cintelis.ai", custom_domain = true },
  { pattern = "api.cintelis.ai", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker before static assets so the legacy-host redirect in fetch()
# covers every path (the Worker falls through to env.ASSETS.fetch for the SPA).
run_worker_first = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "outreach-db"
database_id = "<your-d1-database-id>"

# KV Namespace (for sessions)
[[kv_namespaces]]
binding = "KV"
id = "<your-kv-namespace-id>"

# KV Namespace shared with 365soft-email-worker (unsubscribe store)
# Use the SAME id as the UNSUBSCRIBES binding in the email worker
[[kv_namespaces]]
binding = "UNSUBSCRIBES"
id = "<email-worker-unsubscribes-kv-id>"

# R2 bucket for issue + page attachments (Sprint 6)
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "pulse-attachments"

# Browser Rendering — used by /api/doc-pages/:id/pdf for server-side PDF generation
[browser]
binding = "BROWSER"

# Cron Trigger runs scheduler every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Secrets (set via: wrangler secret put)
# ADMIN_USER - your login username
# ADMIN_PASS - your login password
# CF_ACCESS_CLIENT_ID - Cloudflare Access client ID for email API
# CF_ACCESS_CLIENT_SECRET - Cloudflare Access client secret for email API
# LINKEDIN_CLIENT_SECRET - LinkedIn app Primary Client Secret (Ad Library API)
# XERO_CLIENT_ID / XERO_CLIENT_SECRET - Xero app (invoice sync); redirect URI
#   https://projects.cintelis.ai/api/xero/callback. Optional: XERO_SCOPES, XERO_SYNC_MINUTES
# Optional overrides (defaults baked into worker/linkedin.js):
#   LINKEDIN_CLIENT_ID, LINKEDIN_REDIRECT_URI, LINKEDIN_OAUTH_SCOPE
# Redirect URI must be registered in the LinkedIn app's Auth settings:
#   https://projects.cintelis.ai/api/linkedin/callback
